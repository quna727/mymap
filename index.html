<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달빛 소아 진료 지도</title>

  <!-- 카카오맵 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services&autoload=false"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    header {
      padding: 18px 22px;
      background: #3878f5;
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .app {
      display: grid;
      grid-template-columns: 370px minmax(0, 1fr);
      height: calc(100vh - 82px);
      min-height: 500px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid #ddd;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      flex: 1;
      padding: 14px 5px;
      border: 0;
      background: #f3f5f8;
      cursor: pointer;
      font-size: 13px;
    }

    .tab.active {
      background: white;
      color: #2467e8;
      font-weight: bold;
      box-shadow: inset 0 -3px #3878f5;
    }

    .search-panel {
      padding: 14px;
      border-bottom: 1px solid #ddd;
    }

    label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input, select, .search-button {
      width: 100%;
      min-height: 40px;
      margin-bottom: 10px;
      padding: 9px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 14px;
    }

    .search-button {
      margin-bottom: 0;
      border: 0;
      background: #3878f5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .search-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      padding: 12px 14px;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .notice {
      padding: 10px 14px;
      background: #fff8e6;
      color: #765b14;
      font-size: 12px;
      line-height: 1.5;
    }

    #results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .result {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result:hover {
      background: #f5f8ff;
    }

    .result h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }

    .result p {
      margin: 4px 0;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .tag {
      display: inline-block;
      padding: 3px 7px;
      margin-bottom: 7px;
      border-radius: 4px;
      background: #e8f0ff;
      color: #245fc7;
      font-size: 11px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: #f1f3f5;
    }

    @media (max-width: 760px) {
      .app {
        display: flex;
        flex-direction: column;
        height: auto;
      }

      #map {
        order: 1;
        height: 42vh;
        min-height: 300px;
      }

      .sidebar {
        order: 2;
        min-height: 500px;
      }

      #results {
        max-height: 450px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🌙 달빛 소아 진료 지도</h1>
    <p>지역별 병·의원 정보를 검색해 보세요.</p>
  </header>

  <main class="app">
    <section class="sidebar">
      <div class="tabs">
        <button class="tab active" id="moonlightTab" type="button">
          달빛어린이병원
        </button>
        <button class="tab" id="pediatricTab" type="button">
          병·의원 검색
        </button>
      </div>

      <div class="search-panel">
        <label for="region">시·도</label>
        <select id="region">
          <option>서울특별시</option>
          <option>부산광역시</option>
          <option>대구광역시</option>
          <option>인천광역시</option>
          <option>광주광역시</option>
          <option>대전광역시</option>
          <option>울산광역시</option>
          <option>세종특별자치시</option>
          <option>경기도</option>
          <option>강원특별자치도</option>
          <option>충청북도</option>
          <option>충청남도</option>
          <option>전북특별자치도</option>
          <option>전라남도</option>
          <option>경상북도</option>
          <option>경상남도</option>
          <option>제주특별자치도</option>
        </select>

        <label for="district">시·군·구 (선택)</label>
        <input id="district" placeholder="예: 강남구, 수원시">

        <label for="keyword">병원 이름 (선택)</label>
        <input id="keyword" placeholder="예: 어린이병원">

        <button class="search-button" id="searchButton" type="button">
          검색하기
        </button>
      </div>

      <div class="notice" id="notice">
        병·의원 기본정보 검색 결과입니다.
        공식 지정 여부 및 실제 진료시간은 별도 확인이 필요합니다.
      </div>

      <div id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다...
      </div>

      <div id="results"></div>
    </section>

    <div id="map" aria-label="병원 위치 지도"></div>
  </main>

  <script>
    // =========================================
    // 1. 설정
    // =========================================

    // 공공데이터포털에서 발급받은 인증키를 입력하세요.
    // 일반 인증키(Decoding)를 사용하는 경우 해당 키를 넣으세요.
    const SERVICE_KEY = "YOUR_SERVICE_KEY";

    const API_URL =
      "https://apis.data.go.kr/B552657/HsptlAsembySearchService/getHsptlMdcncListInfoInqire";

    const DEFAULT_LATITUDE = 37.566826;
    const DEFAULT_LONGITUDE = 126.9786567;
    const DEFAULT_LEVEL = 5;

    let map = null;
    let infoWindow = null;
    let markers = [];
    let mapReady = false;
    let currentTab = "moonlight";
    let searchSequence = 0;

    const regionSelect = document.getElementById("region");
    const districtInput = document.getElementById("district");
    const keywordInput = document.getElementById("keyword");
    const searchButton = document.getElementById("searchButton");
    const statusElement = document.getElementById("status");
    const resultsElement = document.getElementById("results");
    const noticeElement = document.getElementById("notice");
    const moonlightTab = document.getElementById("moonlightTab");
    const pediatricTab = document.getElementById("pediatricTab");

    function setStatus(message) {
      statusElement.textContent = message;
    }

    // =========================================
    // 2. 지도 초기화
    // =========================================

    function initializeMap() {
      const center = new kakao.maps.LatLng(
        DEFAULT_LATITUDE,
        DEFAULT_LONGITUDE
      );

      map = new kakao.maps.Map(document.getElementById("map"), {
        center: center,
        level: DEFAULT_LEVEL
      });

      infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });
      mapReady = true;

      setStatus("지도가 준비되었습니다. 지역을 선택하고 검색하세요.");

      searchButton.addEventListener("click", searchHospitals);

      [districtInput, keywordInput].forEach(function (input) {
        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter") searchHospitals();
        });
      });

      moonlightTab.addEventListener("click", function () {
        changeTab("moonlight");
      });

      pediatricTab.addEventListener("click", function () {
        changeTab("pediatric");
      });

      // 위치 사용을 허용한 경우 현재 위치로 이동합니다.
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            map.setCenter(new kakao.maps.LatLng(
              position.coords.latitude,
              position.coords.longitude
            ));
          },
          function () {
            // 권한이 없으면 기본 위치인 서울시청을 사용합니다.
          },
          { timeout: 5000, maximumAge: 60000 }
        );
      }

      searchHospitals();
    }

    // =========================================
    // 3. 탭 변경
    // =========================================

    function changeTab(tabName) {
      currentTab = tabName;

      moonlightTab.classList.toggle(
        "active", tabName === "moonlight"
      );
      pediatricTab.classList.toggle(
        "active", tabName === "pediatric"
      );

      if (tabName === "moonlight") {
        noticeElement.textContent =
          "일반 병·의원 API만으로 공식 달빛어린이병원 지정 여부를 " +
          "확정할 수 없습니다. 공식 지정 목록과 대조해야 합니다.";
      } else {
        noticeElement.textContent =
          "국립중앙의료원 병·의원 API에서 지역별 정보를 검색합니다. " +
          "이 API의 결과가 소아청소년과만을 의미하는 것은 아닙니다.";
      }

      if (mapReady) searchHospitals();
    }

    // =========================================
    // 4. 공공데이터 API 요청
    // =========================================

    async function searchHospitals() {
      if (!mapReady) return;

      if (!SERVICE_KEY || SERVICE_KEY === "6fea20374da1747f7fd5d2ad40bce4ce9f435449d84d7eee5281ef3f7e92b0e9
") {
        setStatus(
          "공공데이터 API 인증키를 입력해야 합니다.\n" +
          "코드 위쪽 SERVICE_KEY 값을 발급받은 키로 바꿔주세요."
        );
        return;
      }

      const thisSearch = ++searchSequence;

      searchButton.disabled = true;
      searchButton.textContent = "검색 중...";
      setStatus("공공데이터에서 병·의원 정보를 가져오는 중입니다...");
      clearMarkers();

      const params = new URLSearchParams();

      params.set("serviceKey", SERVICE_KEY);
      params.set("Q0", regionSelect.value);
      params.set("numOfRows", "100");
      params.set("pageNo", "1");
      params.set("ORD", "NAME");

      const district = districtInput.value.trim();
      const keyword = keywordInput.value.trim();

      if (district) params.set("Q1", district);

      // 병원 이름을 입력하면 API의 기관명 검색 조건으로 사용합니다.
      if (keyword) params.set("QN", keyword);

      const requestUrl = API_URL + "?" + params.toString();

      try {
        const response = await fetch(requestUrl);

        if (!response.ok) {
          throw new Error("HTTP 오류: " + response.status);
        }

        const xmlText = await response.text();

        // 응답이 XML인지 확인하고 파싱합니다.
        const xml = new DOMParser().parseFromString(
          xmlText, "application/xml"
        );

        if (xml.querySelector("parsererror")) {
          throw new Error("API 응답을 XML로 읽지 못했습니다.");
        }

        const resultCode =
          xml.querySelector("header resultCode")?.textContent;

        const resultMessage =
          xml.querySelector("header resultMsg")?.textContent;

        if (resultCode && resultCode !== "00") {
          throw new Error(
            "공공데이터 API 오류: " + (resultMessage || resultCode)
          );
        }

        const items = Array.from(xml.querySelectorAll("item"));

        if (thisSearch !== searchSequence) return;

        if (items.length === 0) {
          setStatus(
            "검색 결과가 없습니다.\n" +
            "지역이나 병원 이름을 바꿔 다시 검색해보세요."
          );
          return;
        }

        const hospitals = items.map(parseHospital);

        // 달빛 탭은 이름만으로 공식 지정 여부를 판단하지 않습니다.
        // 따라서 기본 병·의원 API 결과를 공식 지정 병원이라고 표시하지 않습니다.
        if (currentTab === "moonlight") {
          setStatus(
            "기본 병·의원 정보 " + hospitals.length + "건을 받았습니다.\n" +
            "공식 지정 병원 목록과 연결되지 않아 지도에는 표시하지 않았습니다."
          );
          resultsElement.innerHTML = "";

          const message = document.createElement("p");
          message.style.cssText = "padding:14px;font-size:13px;line-height:1.6;";
          message.textContent =
            "공식 달빛어린이병원 목록을 별도로 연결해야 합니다. " +
            "일반 병·의원 데이터만으로 지정 병원을 정확하게 구분할 수 없습니다.";
          resultsElement.appendChild(message);
          return;
        }

        displayHospitals(hospitals);
      } catch (error) {
        console.error("병원 API 오류:", error);

        setStatus(
          "공공데이터를 가져오지 못했습니다.\n" +
          error.message + "\n\n" +
          "브라우저에서 CORS 요청이 차단되었거나 인증키, API 신청 상태, " +
          "요청 주소에 문제가 있을 수 있습니다."
        );
      } finally {
        if (thisSearch === searchSequence) {
          searchButton.disabled = false;
          searchButton.textContent = "검색하기";
        }
      }
    }

    // =========================================
    // 5. XML의 병원 정보 읽기
    // =========================================

    function getTagText(item, tagName) {
      return item.querySelector(tagName)?.textContent?.trim() || "";
    }

    function parseHospital(item) {
      return {
        name: getTagText(item, "dutyName"),
        address: getTagText(item, "dutyAddr"),
        phone: getTagText(item, "dutyTel1"),
        latitude: Number(getTagText(item, "wgs84Lat")),
        longitude: Number(getTagText(item, "wgs84Lon")),
        id: getTagText(item, "hpid")
      };
    }

    // =========================================
    // 6. 지도 마커와 결과 목록
    // =========================================

    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];

      if (infoWindow) infoWindow.close();

      resultsElement.innerHTML = "";
    }

    function displayHospitals(hospitals) {
      const bounds = new kakao.maps.LatLngBounds();
      let displayedCount = 0;

      hospitals.forEach(function (hospital) {
        const hasCoordinates =
          Number.isFinite(hospital.latitude) &&
          Number.isFinite(hospital.longitude) &&
          hospital.latitude !== 0 &&
          hospital.longitude !== 0;

        const item = document.createElement("article");
        item.className = "result";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "공공데이터 병·의원 정보";

        const title = document.createElement("h3");
        title.textContent = hospital.name || "이름 정보 없음";

        const address = document.createElement("p");
        address.textContent = "주소: " + (hospital.address || "정보 없음");

        const phone = document.createElement("p");
        phone.textContent = "전화: " + (hospital.phone || "정보 없음");

        item.appendChild(tag);
        item.appendChild(title);
        item.appendChild(address);
        item.appendChild(phone);

        if (hasCoordinates) {
          const position = new kakao.maps.LatLng(
            hospital.latitude, hospital.longitude
          );

          const marker = new kakao.maps.Marker({
            map: map,
            position: position,
            title: hospital.name
          });

          markers.push(marker);
          bounds.extend(position);
          displayedCount++;

          kakao.maps.event.addListener(marker, "click", function () {
            showInfo(hospital, position);
          });

          item.addEventListener("click", function () {
            map.setCenter(position);
            map.setLevel(3);
            showInfo(hospital, position);
          });
        } else {
          const noLocation = document.createElement("p");
          noLocation.textContent = "위치 좌표가 없어 지도에 표시하지 못했습니다.";
          item.appendChild(noLocation);
        }

        resultsElement.appendChild(item);
      });

      if (displayedCount === 1) {
        const first = markers[0].getPosition();
        map.setCenter(first);
      } else if (displayedCount > 1) {
        map.setBounds(bounds);
      }

      setStatus(
        "API 결과 " + hospitals.length + "건 중 " +
        displayedCount + "건을 지도에 표시했습니다."
      );
    }

    // =========================================
    // 7. 지도 정보창
    // =========================================

    function showInfo(hospital, position) {
      const content = document.createElement("div");
      content.style.cssText =
        "padding:10px;max-width:250px;font-size:13px;line-height:1.6;";

      const name = document.createElement("strong");
      name.textContent = hospital.name || "이름 정보 없음";

      const address = document.createElement("div");
      address.textContent = hospital.address || "주소 정보 없음";

      const phone = document.createElement("div");
      phone.textContent = hospital.phone || "전화번호 정보 없음";

      content.appendChild(name);
      content.appendChild(address);
      content.appendChild(phone);

      infoWindow.setContent(content);
      infoWindow.setPosition(position);
      infoWindow.open(map);
    }

    // =========================================
    // 8. SDK 로딩 후 지도 생성
    // =========================================

    window.addEventListener("load", function () {
      if (!window.kakao || !window.kakao.maps) {
        setStatus(
          "카카오맵 SDK를 불러오지 못했습니다.\n" +
          "카카오 개발자 사이트의 JavaScript 키와 Web 도메인 설정을 확인해주세요."
        );
        return;
      }

      kakao.maps.load(function () {
        try {
          initializeMap();
        } catch (error) {
          console.error("지도 초기화 오류:", error);
          setStatus(
            "지도 초기화에 실패했습니다.\n" +
            "카카오 JavaScript 키와 도메인 등록을 확인해주세요."
          );
        }
      });
    });
  </script>
</body>
</html>
