<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>달빛어린이병원 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    .app {
      display: flex;
      height: 100vh;
      min-height: 500px;
    }

    .sidebar {
      width: 360px;
      flex-shrink: 0;
      padding: 22px;
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #ddd;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 20px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #searchInput {
      min-width: 0;
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    #searchButton {
      padding: 0 15px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #2878ff;
      font-size: 14px;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #155fd6;
    }

    .quick-searches {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }

    .quick-searches button {
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .quick-searches button:hover {
      background: #f0f5ff;
    }

    #status {
      margin: 12px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    #results {
      padding: 0;
      margin: 0;
      list-style: none;
    }
