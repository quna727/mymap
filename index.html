<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 주변 장소 검색</title>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        /* 페이지의 기본 스타일을 설정합니다. */
        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽과 오른쪽으로 나눕니다. */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역입니다. */
        .sidebar {
            width: 380px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background-color: #fff;
            z-index: 1;
        }

        /* 서비스 제목입니다. */
        .header {
            padding: 24px 20px 16px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }

        /* 검색창과 버튼을 한 줄에 배치합니다. */
        .search-box {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
        }

        .search-box input {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #3182f6;
        }

        .search-box button {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background-color: #3182f6;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #1765cf;
        }

        /* 검색 상태 메시지입니다. */
        .status {
            padding: 0 20px 12px;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        /* 검색 결과가 표시되는 영역입니다. */
        .result-list {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        /* 장소 하나의 결과 항목입니다. */
        .place-item {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .place-item:hover {
            background-color: #f5f8ff;
        }

        .place-item h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .place-item p {
            margin: 4px 0;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .place-item a {
            display: inline-block;
            margin-top: 8px;
            color: #3182f6;
            font-size: 13px;
            text-decoration: none;
        }

        /* 오른쪽 지도 영역입니다. */
        .map-area {
            flex: 1;
            min-width: 0;
            position: relative;
            background-color: #f2f4f7;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* 지도 위에 현재 위치 버튼을 표시합니다. */
        .location-button {
            position: absolute;
            right: 16px;
            bottom: 30px;
            z-index: 2;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 2px 8px #00000018;
            cursor: pointer;
        }

        .location-button:hover {
            background-color: #f5f8ff;
        }

        /* 화면이 좁을 때 검색창과 지도를 세로로 배치합니다. */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                min-height: 240px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .map-area {
                flex: 1;
                min-height: 0;
            }

            .location-button {
                right: 12px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색창과 결과 목록입니다. -->
        <aside class="sidebar">
            <div class="header">
                <h1>📍 장소 검색</h1>
                <p>가고 싶은 장소를 검색해 보세요.</p>
            </div>

            <form class="search-box" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="카페, 맛집, 도서관..."
                    aria-label="장소 검색어"
                    required
                >
                <button type="submit" id="searchButton">
                    검색
                </button>
            </form>

            <div class="status" id="status" role="status" aria-live="polite">
                지도를 준비하고 있습니다...
            </div>

            <div class="result-list" id="resultList">
            </div>
        </aside>

        <!-- 오른쪽 지도 영역입니다. -->
        <main class="map-area">
            <div id="map"></div>

            <button
                class="location-button"
                id="locationButton"
                type="button"
            >
                현재 위치로 이동
            </button>
        </main>

    </div>

    <!-- 카카오 지도 SDK와 장소 검색 라이브러리를 불러옵니다. -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services&autoload=false"
    ></script>

    <script>
        // 지도의 기본 중심 좌표는 서울시청입니다.
        const defaultLatitude = 37.566826;
        const defaultLongitude = 126.9786567;
        const defaultLevel = 5;

        // 지도와 검색에 사용할 변수를 선언합니다.
        let map = null;
        let placesService = null;
        let currentMarker = null;
        let placeMarkers = [];
        let infoWindow = null;
        let currentPosition = null;
        let isMapReady = false;

        // HTML 요소를 변수에 저장합니다.
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const statusElement = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const locationButton = document.getElementById("locationButton");

        // 화면에 상태 메시지를 표시합니다.
        function setStatus(message) {
            statusElement.textContent = message;
        }

        // 카카오 지도 SDK가 준비되었을 때만 지도를 생성합니다.
        function initializeMap() {
            const mapContainer = document.getElementById("map");

            // 서울시청을 기본 중심으로 지도를 생성합니다.
            const mapOption = {
                center: new kakao.maps.LatLng(
                    defaultLatitude,
                    defaultLongitude
                ),
                level: defaultLevel
            };

            map = new kakao.maps.Map(mapContainer, mapOption);

            // 장소 검색 서비스와 정보창을 생성합니다.
            placesService = new kakao.maps.services.Places(map);
            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            isMapReady = true;
            setStatus("현재 위치를 확인하고 있습니다...");

            // 지도가 생성된 후 현재 위치를 요청합니다.
            getCurrentLocation();

            // 검색 폼의 제출 이벤트를 등록합니다.
            searchForm.addEventListener("submit", function(event) {
                event.preventDefault();
                searchPlaces();
            });

            // 현재 위치 버튼의 클릭 이벤트를 등록합니다.
            locationButton.addEventListener("click", function() {
                getCurrentLocation();
            });
        }

        // 브라우저의 위치 정보를 요청합니다.
        function getCurrentLocation() {
            if (!isMapReady || !map) {
                return;
            }

            // 브라우저에서 위치 기능을 지원하는지 확인합니다.
            if (!navigator.geolocation) {
                setStatus(
                    "현재 위치를 사용할 수 없습니다. 서울을 중심으로 표시합니다."
                );
                return;
            }

            setStatus("위치 권한을 확인하고 있습니다...");

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // 위도와 경도를 가져옵니다.
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 현재 위치를 중심으로 지도를 이동합니다.
                    map.setCenter(currentPosition);
                    map.setLevel(defaultLevel);

                    // 기존 현재 위치 마커가 있다면 제거합니다.
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    // 현재 위치에 마커를 표시합니다.
                    currentMarker = new kakao.maps.Marker({
                        position: currentPosition,
                        map: map
                    });

                    setStatus(
                        "현재 위치를 표시했습니다. 원하는 장소를 검색해 보세요."
                    );
                },
                function(error) {
                    // 위치 권한 거부 또는 오류 상황을 처리합니다.
                    let errorMessage = "현재 위치를 가져오지 못했습니다.";

                    if (error.code === error.PERMISSION_DENIED) {
                        errorMessage = "위치 권한이 거부되었습니다. 브라우저 설정에서 허용할 수 있습니다.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        errorMessage = "현재 위치 정보를 확인할 수 없습니다.";
                    } else if (error.code === error.TIMEOUT) {
                        errorMessage = "위치 확인 시간이 초과되었습니다.";
                    }

                    setStatus(
                        errorMessage + " 서울을 기본 중심으로 표시합니다."
                    );
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 이전 검색에서 표시한 장소 마커를 제거합니다.
        function clearPlaceMarkers() {
            placeMarkers.forEach(function(marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
            infoWindow.close();
        }

        // 검색 결과 목록을 비웁니다.
        function clearResults() {
            resultList.replaceChildren();
        }

        // 입력한 키워드로 장소를 검색합니다.
        function searchPlaces() {
            if (!isMapReady || !placesService) {
                setStatus("지도를 준비하고 있습니다.");
                return;
            }

            const keyword = searchInput.value.trim();

            if (!keyword) {
                setStatus("검색어를 입력해 주세요.");
                searchInput.focus();
                return;
            }

            clearResults();
            clearPlaceMarkers();
            setStatus("장소를 검색하고 있습니다...");
            searchButton.disabled = true;

            // 카카오 장소 검색 API를 호출합니다.
            placesService.keywordSearch(
                keyword,
                function(data, status, pagination) {
                    searchButton.disabled = false;

                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data);
                        setStatus(
                            "검색 결과 " + data.length + "개를 찾았습니다."
                        );
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        setStatus("검색 결과가 없습니다. 다른 검색어를 입력해 보세요.");
                    } else {
                        setStatus("검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
                    }
                },
                {
                    // 현재 지도 중심과 가까운 장소를 우선 검색합니다.
                    location: map.getCenter(),
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 검색 결과를 목록과 지도 마커로 표시합니다.
        function displayPlaces(places) {
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function(place) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 장소 마커를 생성합니다.
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                // 마커를 클릭하면 장소 이름을 표시합니다.
                kakao.maps.event.addListener(marker, "click", function() {
                    showPlaceInfo(place, marker);
                });

                // 검색 결과 목록에 장소 정보를 추가합니다.
                const item = document.createElement("article");
                item.className = "place-item";
                item.tabIndex = 0;

                const title = document.createElement("h3");
                title.textContent = place.place_name;

                const category = document.createElement("p");
                category.textContent = place.category_name || "분류 정보 없음";

                const address = document.createElement("p");
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                item.append(title, category, address);

                // 장소의 상세 정보를 카카오맵에서 열 수 있도록 합니다.
                if (place.place_url) {
                    const link = document.createElement("a");
                    link.textContent = "카카오맵에서 보기";
                    link.href = place.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";

                    item.appendChild(link);
                }

                // 목록 항목을 클릭하면 지도 중심을 해당 장소로 옮깁니다.
                function selectPlace() {
                    map.panTo(position);
                    showPlaceInfo(place, marker);
                }

                item.addEventListener("click", selectPlace);

                item.addEventListener("keydown", function(event) {
                    if (
                        (event.key === "Enter" || event.key === " ") &&
                        event.target === item
                    ) {
                        event.preventDefault();
                        selectPlace();
                    }
                });

                resultList.appendChild(item);
            });

            // 검색 결과 전체가 보이도록 지도 범위를 조정합니다.
            if (places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 선택한 장소의 이름과 주소를 지도 위에 표시합니다.
        function showPlaceInfo(place, marker) {
            const content = document.createElement("div");
            content.style.cssText =
                "padding:10px 12px; min-width:150px; max-width:240px; " +
                "font-size:13px; line-height:1.6; overflow-wrap:anywhere;";

            const title = document.createElement("strong");
            title.textContent = place.place_name;
            content.appendChild(title);

            const address = document.createElement("div");
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";
            content.appendChild(address);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 카카오 SDK의 로딩이 끝난 후에 지도 초기화를 실행합니다.
        window.addEventListener("load", function() {
            if (!window.kakao || !kakao.maps) {
                setStatus(
                    "카카오 지도 SDK를 불러오지 못했습니다. 키와 도메인 설정을 확인해 주세요."
                );
                return;
            }

            // SDK 준비가 완료되면 지도 생성 함수를 실행합니다.
            kakao.maps.load(function() {
                try {
                    initializeMap();
                } catch (error) {
                    console.error("지도 초기화 오류:", error);
                    setStatus(
                        "지도 초기화에 실패했습니다. 개발자 도구의 콘솔을 확인해 주세요."
                    );
                }
            });
        });
    </script>
</body>
</html>
