<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전국 달빛어린이병원 지도</title>

  <!-- 카카오맵 SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    header {
      padding: 18px;
      background: #2878e8;
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      font-size: 13px;
    }

    .container {
      display: flex;
      height: calc(100vh - 88px);
      min-height: 480px;
    }

    .sidebar {
      width: 370px;
      min-width: 300px;
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }

    select, input, button {
      width: 100%;
      padding: 11px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    select, input {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #2878e8;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .notice {
      margin: 12px 0;
      padding: 10px;
      background: #f2f6fc;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
    }

    .hospital {
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .hospital h3 {
      margin: 5px 0 8px;
      font-size: 15px;
    }

    .hospital p {
      margin: 5px 0;
      font-size: 12px;
      line-height: 1.5;
      color: #555;
    }

    .tag {
      display: inline-block;
      padding: 4px 7px;
      border-radius: 5px;
      background: #e4efff;
      color: #205ca8;
      font-size: 11px;
    }

    .tag.pediatric {
      background: #e5f6ec;
      color: #187342;
    }

    .hospital a {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: #1769cc;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    @media (max-width: 700px) {
      .container {
        height: auto;
        flex-direction: column-reverse;
      }

      #map {
        height: 45vh;
        min-height: 280px;
        flex: none;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🌙 전국 달빛어린이병원 지도</h1>
    <p>지역을 선택해 야간·휴일 소아 진료 병원을 찾아보세요.</p>
  </header>

  <div class="container">
    <aside class="sidebar">
      <label for="regionSelect">검색할 지역</label>

      <select id="regionSelect">
        <option value="서울특별시">서울특별시</option>
        <option value="부산광역시">부산광역시</option>
        <option value="대구광역시">대구광역시</option>
        <option value="인천광역시">인천광역시</option>
        <option value="광주광역시">광주광역시</option>
        <option value="대전광역시">대전광역시</option>
        <option value="울산광역시">울산광역시</option>
        <option value="세종특별자치시">세종특별자치시</option>
        <option value="경기도">경기도</option>
        <option value="강원특별자치도">강원특별자치도</option>
        <option value="충청북도">충청북도</option>
        <option value="충청남도">충청남도</option>
        <option value="전북특별자치도">전북특별자치도</option>
        <option value="전라남도">전라남도</option>
        <option value="경상북도">경상북도</option>
        <option value="경상남도">경상남도</option>
        <option value="제주특별자치도">제주특별자치도</option>
      </select>

      <label for="districtInput">세부 지역 (선택)</label>
      <input
        id="districtInput"
        type="text"
        placeholder="예: 강남구, 수원시, 해운대구"
      >

      <button id="searchButton">선택한 지역 병원 검색</button>

      <div class="notice">
        공식 달빛어린이병원과 주변 소아과 검색 결과를 보여줍니다.
        진료시간은 카카오맵 검색 결과만으로 확정할 수 없으므로
        병원에 직접 확인해 주세요.
      </div>

      <div id="status" role="status" aria-live="polite">
        지역을 선택하고 검색 버튼을 눌러 주세요.
      </div>

      <div id="results"></div>
    </aside>

    <div id="map"></div>
  </div>

  <script>
    // 지도와 장소 검색 객체
    let map;
    let places;
    let markers = [];
    let infoWindows = [];
    let isSearching = false;

    const regionSelect = document.getElementById("regionSelect");
    const districtInput = document.getElementById("districtInput");
    const searchButton = document.getElementById("searchButton");
    const statusElement = document.getElementById("status");
    const resultsElement = document.getElementById("results");

    // 기본 지도 위치: 서울
    const defaultPosition = new kakao.maps.LatLng(
      37.5665,
      126.9780
    );

    // 지도 초기화
    function initializeMap() {
      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 8
        }
      );

      places = new kakao.maps.services.Places();

      // 페이지를 열자마자 위치 권한을 요청하지 않습니다.
    }

    // 검색할 지역 이름 만들기
    function getSearchRegion() {
      const region = regionSelect.value;
      const district = districtInput.value.trim();

      return district ? region + " " + district : region;
    }

    // 두 검색이 모두 끝나면 결과를 표시합니다.
    function searchRegionHospitals() {
      if (isSearching) return;

      isSearching = true;
      searchButton.disabled = true;
      resultsElement.innerHTML = "";
      clearMarkers();

      const region = getSearchRegion();
      const allPlaces = [];
      let finished = 0;

      statusElement.textContent =
        region + " 지역의 병원을 검색하고 있습니다.";

      // 공식 병원 검색과 주변 소아과 검색을 각각 실행합니다.
      searchKeyword(region + " 달빛어린이병원", "official");
      searchKeyword(region + " 소아청소년과", "pediatric");

      function searchKeyword(keyword, type) {
        places.keywordSearch(
          keyword,
          function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
              data.forEach(function(place) {
                // 빵집 등 병원이 아닌 결과를 제외합니다.
                if (!isHospitalResult(place)) return;

                const existing = allPlaces.find(function(item) {
                  return item.id === place.id;
                });

                if (existing) {
                  if (type === "official") {
                    existing.isOfficial = true;
                  }
                } else {
                  allPlaces.push({
                    id: place.id,
                    name: place.place_name,
                    address: place.road_address_name ||
                             place.address_name ||
                             "주소 정보 없음",
                    phone: place.phone || "전화번호 정보 없음",
                    url: place.place_url || "",
                    lat: Number(place.y),
                    lng: Number(place.x),
                    isOfficial: type === "official"
                  });
                }
              });
            }

            finished++;

            if (finished === 2) {
              isSearching = false;
              searchButton.disabled = false;
              displayResults(allPlaces, region);
            }
          },
          {
            size: 15
          }
        );
      }
    }

    // 병원 관련 결과만 허용합니다.
    function isHospitalResult(place) {
      const category = place.category_name || "";
      const name = place.place_name || "";

      const categoryIsMedical =
        category.includes("병원") ||
        category.includes("의원") ||
        category.includes("소아청소년과") ||
        category.includes("소아과");

      const nameLooksMedical =
        name.includes("병원") ||
        name.includes("의원") ||
        name.includes("소아과") ||
        name.includes("소아청소년과");

      return categoryIsMedical || nameLooksMedical;
    }

    // 검색 결과 표시
    function displayResults(hospitals, region) {
      resultsElement.innerHTML = "";

      // 세부 지역을 검색했다면 지도 중심을 검색 결과 위치로 옮깁니다.
      if (hospitals.length > 0) {
        const first = hospitals[0];

        if (Number.isFinite(first.lat) && Number.isFinite(first.lng)) {
          map.setCenter(new kakao.maps.LatLng(first.lat, first.lng));
          map.setLevel(7);
        }
      } else {
        // 검색 결과가 없더라도 지역을 지도로 찾을 수 있게 합니다.
        const geocoder = new kakao.maps.services.Geocoder();

        geocoder.addressSearch(region, function(data, status) {
          if (
            status === kakao.maps.services.Status.OK &&
            data.length > 0
          ) {
            map.setCenter(
              new kakao.maps.LatLng(
                Number(data[0].y),
                Number(data[0].x)
              )
            );
            map.setLevel(8);
          }
        });
      }

      if (hospitals.length === 0) {
        statusElement.textContent =
          region + " 지역에서 검색된 병원이 없습니다. " +
          "세부 지역을 바꾸거나 다른 지역을 선택해 주세요.";
        return;
      }

      // 공식 달빛어린이병원을 먼저, 나머지는 그다음 표시합니다.
      hospitals.sort(function(a, b) {
        if (a.isOfficial !== b.isOfficial) {
          return a.isOfficial ? -1 : 1;
        }

        return a.name.localeCompare(b.name, "ko");
      });

      statusElement.textContent =
        region + " 검색 결과: " + hospitals.length +
        "곳. 진료시간은 병원에 직접 확인해 주세요.";

      hospitals.forEach(function(hospital) {
        addMarker(hospital);
        addHospitalCard(hospital);
      });
    }

    // 지도 마커 생성
    function addMarker(hospital) {
      if (!Number.isFinite(hospital.lat) ||
          !Number.isFinite(hospital.lng)) {
        return;
      }

      const position = new kakao.maps.LatLng(
        hospital.lat,
        hospital.lng
      );

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: hospital.name
      });

      markers.push(marker);

      const content = document.createElement("div");
      content.style.padding = "8px";
      content.style.fontSize = "12px";
      content.textContent =
        hospital.name + " · 진료시간 확인 필요";

      const infoWindow = new kakao.maps.InfoWindow({
        content: content
      });

      infoWindows.push(infoWindow);

      kakao.maps.event.addListener(marker, "click", function() {
        infoWindows.forEach(function(windowItem) {
          windowItem.close();
        });

        infoWindow.open(map, marker);
      });
    }

    // 왼쪽 병원 카드 생성
    function addHospitalCard(hospital) {
      const card = document.createElement("div");
      card.className = "hospital";

      const tag = document.createElement("span");
      tag.className = hospital.isOfficial
        ? "tag"
        : "tag pediatric";

      tag.textContent = hospital.isOfficial
        ? "달빛어린이병원 검색 결과"
        : "주변 소아과 검색 결과";

      const title = document.createElement("h3");
      title.textContent = hospital.name;

      const address = document.createElement("p");
      address.textContent = "주소: " + hospital.address;

      const phone = document.createElement("p");
      phone.textContent = "전화: " + hospital.phone;

      const hours = document.createElement("p");
      hours.textContent = "야간·휴일 진료: 진료시간 확인 필요";

      card.appendChild(tag);
      card.appendChild(title);
      card.appendChild(address);
      card.appendChild(phone);
      card.appendChild(hours);

      if (hospital.url) {
        const link = document.createElement("a");
        link.href = hospital.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "카카오맵에서 상세 정보 보기";

        card.appendChild(link);
      }

      card.addEventListener("click", function(event) {
        if (event.target.tagName === "A") return;

        map.setCenter(
          new kakao.maps.LatLng(hospital.lat, hospital.lng)
        );
        map.setLevel(4);
      });

      resultsElement.appendChild(card);
    }

    // 이전 검색 마커 제거
    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      infoWindows.forEach(function(windowItem) {
        windowItem.close();
      });

      markers = [];
      infoWindows = [];
    }

    searchButton.addEventListener("click", searchRegionHospitals);

    // SDK가 준비된 뒤 지도를 초기화합니다.
    window.addEventListener("load", initializeMap);
  </script>
</body>
</html>
