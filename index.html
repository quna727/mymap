<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달빛어린이병원 지도</title>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        /* 화면을 왼쪽 검색 영역과 오른쪽 지도 영역으로 나눕니다. */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역입니다. */
        .sidebar {
            width: 390px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background: #fff;
            z-index: 1;
        }

        .header {
            padding: 22px 20px 14px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 병원 종류를 선택하는 탭입니다. */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #555;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            color: #fff;
            background: #3182f6;
            border-color: #3182f6;
        }

        /* 지역을 선택하는 영역입니다. */
        .region-box {
            display: grid;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .region-box label {
            font-size: 13px;
            font-weight: bold;
        }

        .region-box select,
        .region-box input {
            width: 100%;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #fff;
            font-size: 13px;
        }

        /* 검색창과 검색 버튼입니다. */
        .search-box {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .search-box input {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box input:focus {
            outline: 2px solid #cfe0ff;
            border-color: #3182f6;
        }

        .search-box button {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: #3182f6;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            padding: 0 18px 12px;
            color: #666;
            font-size: 12px;
            line-height: 1.6;
        }

        /* 검색 결과 목록입니다. */
        .result-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .place-item {
            padding: 16px 18px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover,
        .place-item:focus {
            background: #f5f8ff;
            outline-color: #3182f6;
        }

        .place-item h3 {
            margin: 0 0 9px;
            font-size: 16px;
        }

        .place-item p {
            margin: 6px 0;
            color: #555;
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .place-item .notice {
            padding: 9px;
            border-radius: 6px;
            background: #fff7e6;
            color: #805b15;
        }

        .place-item a {
            display: inline-block;
            margin-top: 8px;
            color: #1765cf;
            font-size: 12px;
            text-decoration: none;
        }

        .empty-message {
            padding: 22px 18px;
            color: #777;
            font-size: 13px;
            line-height: 1.7;
        }

        /* 오른쪽 지도 영역입니다. */
        .map-area {
            position: relative;
            flex: 1;
            min-width: 0;
            background: #f2f4f7;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .location-button {
            position: absolute;
            right: 16px;
            bottom: 28px;
            z-index: 2;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 8px #00000018;
            cursor: pointer;
        }

        .location-button:hover {
            background: #f5f8ff;
        }

        /* 화면이 좁을 때 세로로 배치합니다. */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 55%;
                min-height: 300px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .region-box {
                grid-template-columns: 1fr 1fr;
            }

            .region-box label {
                grid-column: 1 / -1;
            }

            .map-area {
                flex: 1;
                min-height: 0;
            }

            .location-button {
                right: 12px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색 영역입니다. -->
        <aside class="sidebar">

            <header class="header">
                <h1>🌙 달빛어린이병원 지도</h1>
                <p>
                    야간·휴일 소아 진료기관을 찾아보세요.
                    방문 전 진료 여부를 확인해 주세요.
                </p>
            </header>

            <!-- 병원 종류를 선택하는 탭입니다. -->
            <div class="tabs">
                <button
                    type="button"
                    class="tab-button active"
                    data-type="moonlight"
                    aria-pressed="true"
                >
                    🌙 달빛어린이병원
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-type="pediatric"
                    aria-pressed="false"
                >
                    🏥 주변 소아청소년과
                </button>
            </div>

            <!-- 검색할 지역을 선택합니다. -->
            <div class="region-box">
                <label for="provinceSelect">검색 지역</label>

                <select id="provinceSelect">
                    <option value="">시·도 선택</option>
                    <option value="서울특별시" selected>서울특별시</option>
                    <option value="부산광역시">부산광역시</option>
                    <option value="대구광역시">대구광역시</option>
                    <option value="인천광역시">인천광역시</option>
                    <option value="광주광역시">광주광역시</option>
                    <option value="대전광역시">대전광역시</option>
                    <option value="울산광역시">울산광역시</option>
                    <option value="세종특별자치시">세종특별자치시</option>
                    <option value="경기도">경기도</option>
                    <option value="강원특별자치도">강원특별자치도</option>
                    <option value="충청북도">충청북도</option>
                    <option value="충청남도">충청남도</option>
                    <option value="전북특별자치도">전북특별자치도</option>
                    <option value="전라남도">전라남도</option>
                    <option value="경상북도">경상북도</option>
                    <option value="경상남도">경상남도</option>
                    <option value="제주특별자치도">제주특별자치도</option>
                </select>

                <select id="districtSelect">
                    <option value="">시·군·구 선택</option>
                </select>

                <input
                    id="dongInput"
                    type="text"
                    placeholder="읍·면·동 입력 (선택)"
                    aria-label="읍면동 입력"
                >
            </div>

            <!-- 병원 이름이나 검색어를 입력합니다. -->
            <form class="search-box" id="searchForm">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="병원명 또는 검색어"
                    aria-label="병원 검색어"
                >
                <button type="submit" id="searchButton">검색</button>
            </form>

            <div class="status" id="status" role="status" aria-live="polite">
                카카오 지도를 불러오고 있습니다...
            </div>

            <div class="result-list" id="resultList">
                <div class="empty-message">
                    지도를 불러오는 중입니다.
                </div>
            </div>

        </aside>

        <!-- 오른쪽 지도 영역입니다. -->
        <main class="map-area">
            <div id="map"></div>

            <button
                type="button"
                class="location-button"
                id="locationButton"
            >
                현재 위치로 이동
            </button>
        </main>

    </div>

    <!-- 카카오 지도 SDK를 불러옵니다. 기존 JavaScript 키를 사용합니다. -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services&autoload=false"></script>

    <script>
        // 기본 지도 위치는 서울시청입니다.
        const defaultLatitude = 37.566826;
        const defaultLongitude = 126.9786567;
        const defaultLevel = 5;

        // 지도와 검색에 사용할 변수입니다.
        let map = null;
        let placesService = null;
        let infoWindow = null;
        let currentMarker = null;
        let placeMarkers = [];
        let currentPosition = null;
        let isMapReady = false;
        let activeType = "moonlight";
        let searchSequence = 0;

        // HTML 요소를 변수에 저장합니다.
        const provinceSelect = document.getElementById("provinceSelect");
        const districtSelect = document.getElementById("districtSelect");
        const dongInput = document.getElementById("dongInput");
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const statusElement = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const locationButton = document.getElementById("locationButton");
        const tabButtons = document.querySelectorAll(".tab-button");

        // 상태 메시지를 화면에 표시합니다.
        function setStatus(message) {
            statusElement.textContent = message;
        }

        // 서울의 구 목록을 준비합니다.
        const seoulDistricts = [
            "강남구", "강동구", "강북구", "강서구", "관악구",
            "광진구", "구로구", "금천구", "노원구", "도봉구",
            "동대문구", "동작구", "마포구", "서대문구", "서초구",
            "성동구", "성북구", "송파구", "양천구", "영등포구",
            "용산구", "은평구", "종로구", "중구", "중랑구"
        ];

        // 선택한 시·도에 따라 시·군·구 선택 항목을 변경합니다.
        function updateDistrictOptions() {
            const province = provinceSelect.value;
            const previousDistrict = districtSelect.value;

            districtSelect.replaceChildren();

            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = province === "서울특별시"
                ? "시·군·구 선택"
                : "시·군·구는 검색어로 입력";
            districtSelect.appendChild(defaultOption);

            if (province === "서울특별시") {
                districtSelect.disabled = false;

                seoulDistricts.forEach(function(district) {
                    const option = document.createElement("option");
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });

                // 기존 선택 구가 있으면 유지합니다.
                if (seoulDistricts.includes(previousDistrict)) {
                    districtSelect.value = previousDistrict;
                }
            } else {
                districtSelect.disabled = true;
            }
        }

        // 현재 선택한 지역을 문자열로 만듭니다.
        function getSelectedRegion() {
            const province = provinceSelect.value;
            const district = districtSelect.disabled
                ? ""
                : districtSelect.value;
            const dong = dongInput.value.trim();

            return [province, district, dong]
                .filter(Boolean)
                .join(" ");
        }

        // 이전 검색에서 생성한 마커를 제거합니다.
        function clearPlaceMarkers() {
            placeMarkers.forEach(function(marker) {
                marker.setMap(null);
            });

            placeMarkers = [];

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 이전 검색 결과 목록을 제거합니다.
        function clearResults() {
            resultList.replaceChildren();
        }

        // 검색 결과가 없을 때 안내 문구를 표시합니다.
        function showEmptyMessage(message) {
            const item = document.createElement("div");
            item.className = "empty-message";
            item.textContent = message;
            resultList.appendChild(item);
        }

        // 카카오 지도 객체를 생성합니다.
        function initializeMap() {
            const mapContainer = document.getElementById("map");

            map = new kakao.maps.Map(mapContainer, {
                center: new kakao.maps.LatLng(
                    defaultLatitude,
                    defaultLongitude
                ),
                level: defaultLevel
            });

            // 지도 생성 후 장소 검색 객체를 만듭니다.
            placesService = new kakao.maps.services.Places(map);

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            isMapReady = true;

            setStatus("지도가 준비되었습니다. 병원을 검색해 보세요.");

            // 탭 버튼을 연결합니다.
            tabButtons.forEach(function(button) {
                button.addEventListener("click", function() {
                    activeType = button.dataset.type;

                    tabButtons.forEach(function(tab) {
                        const isActive = tab === button;

                        tab.classList.toggle("active", isActive);
                        tab.setAttribute(
                            "aria-pressed",
                            String(isActive)
                        );
                    });

                    searchInput.value = "";
                    searchHospitals();
                });
            });

            // 검색 폼을 연결합니다.
            searchForm.addEventListener("submit", function(event) {
                event.preventDefault();
                searchHospitals();
            });

            // 지역 선택이 변경되면 다시 검색합니다.
            provinceSelect.addEventListener("change", function() {
                updateDistrictOptions();
                searchHospitals();
            });

            districtSelect.addEventListener("change", searchHospitals);

            dongInput.addEventListener("change", searchHospitals);

            // 현재 위치 버튼을 연결합니다.
            locationButton.addEventListener("click", getCurrentLocation);

            // 현재 위치를 요청합니다.
            getCurrentLocation();
        }

        // 브라우저의 현재 위치를 확인합니다.
        function getCurrentLocation() {
            if (!isMapReady || !map) {
                return;
            }

            if (!navigator.geolocation) {
                setStatus("위치 기능을 사용할 수 없습니다. 지역을 선택해 검색하세요.");
                return;
            }

            setStatus("현재 위치를 확인하고 있습니다...");

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setCenter(currentPosition);
                    map.setLevel(defaultLevel);

                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    currentMarker = new kakao.maps.Marker({
                        position: currentPosition,
                        map: map
                    });

                    setStatus("현재 위치를 확인했습니다. 병원을 검색합니다.");

                    searchHospitals();
                },
                function(error) {
                    let message =
                        "현재 위치를 확인하지 못했습니다. 서울을 중심으로 검색합니다.";

                    if (error.code === error.PERMISSION_DENIED) {
                        message =
                            "위치 권한이 거부되었습니다. 서울을 중심으로 검색합니다.";
                    } else if (error.code === error.TIMEOUT) {
                        message =
                            "위치 확인 시간이 초과되었습니다. 서울을 중심으로 검색합니다.";
                    }

                    setStatus(message);

                    // 위치 권한이 없어도 기본 위치에서 검색할 수 있습니다.
                    searchHospitals();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 선택한 탭과 지역을 기준으로 병원을 검색합니다.
        function searchHospitals() {
            if (!isMapReady || !placesService) {
                setStatus("지도가 아직 준비되지 않았습니다.");
                return;
            }

            // 이전 검색 콜백이 새 검색 결과를 덮어쓰지 않도록 번호를 관리합니다.
            const thisSearch = ++searchSequence;

            const region = getSelectedRegion();
            const typedKeyword = searchInput.value.trim();

            const hospitalKeyword = activeType === "moonlight"
                ? "달빛어린이병원"
                : "소아청소년과";

            // 검색창에 입력한 내용이 있으면 그 내용을 우선 사용합니다.
            // 지역을 선택하지 않았다면 병원 종류만으로 검색합니다.
            const keyword = typedKeyword || hospitalKeyword;

            // 기존 검색 결과를 제거합니다.
            clearPlaceMarkers();
            clearResults();

            setStatus("병원 정보를 검색하고 있습니다...");
            searchButton.disabled = true;

            // 현재 위치를 중심으로 검색합니다.
            // 지역을 선택한 경우에는 지역명을 검색어에 포함합니다.
            const searchKeyword = region
                ? region + " " + keyword
                : keyword;

            const searchOptions = {
                sort: kakao.maps.services.SortBy.DISTANCE,
                size: 15
            };

            // 현재 위치가 있을 때만 검색 중심과 반경을 지정합니다.
            if (currentPosition && !region) {
                searchOptions.location = currentPosition;
                searchOptions.radius = 20000;
            }

            // 카카오 장소 검색 API를 호출합니다.
            placesService.keywordSearch(
                searchKeyword,
                function(data, status, pagination) {
                    // 더 최근에 시작한 검색이 있다면 이전 결과를 무시합니다.
                    if (thisSearch !== searchSequence) {
                        return;
                    }

                    searchButton.disabled = false;

                    if (status === kakao.maps.services.Status.OK) {
                        displayHospitals(data);

                        setStatus(
                            "검색 결과 " + data.length +
                            "개입니다. 진료시간은 방문 전 확인해 주세요."
                        );
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        showEmptyMessage(
                            "검색 결과가 없습니다. 다른 지역이나 검색어를 입력해 보세요."
                        );

                        setStatus(
                            "검색 결과가 없습니다. 다른 검색어를 시도해 보세요."
                        );
                    } else {
                        showEmptyMessage(
                            "검색 중 오류가 발생했습니다. 카카오 키와 도메인 설정을 확인해 주세요."
                        );

                        setStatus("장소 검색에 실패했습니다.");
                        console.error("카카오 장소 검색 실패:", status);
                    }
                },
                searchOptions
            );
        }

        // 검색 결과를 왼쪽 목록과 지도 마커로 표시합니다.
        function displayHospitals(hospitals) {
            const bounds = new kakao.maps.LatLngBounds();

            hospitals.forEach(function(hospital) {
                const position = new kakao.maps.LatLng(
                    hospital.y,
                    hospital.x
                );

                // 병원 위치에 마커를 표시합니다.
                const marker = new kakao.maps.Marker({
                    position: position,
                    map: map
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                // 마커를 누르면 병원 정보를 표시합니다.
                kakao.maps.event.addListener(marker, "click", function() {
                    showHospitalInfo(hospital, marker);
                });

                // 병원 이름을 표시합니다.
                const item = document.createElement("article");
                item.className = "place-item";
                item.tabIndex = 0;

                const title = document.createElement("h3");
                title.textContent = hospital.place_name;

                // 주소를 표시합니다.
                const address = document.createElement("p");
                address.textContent =
                    "📍 주소: " +
                    (
                        hospital.road_address_name ||
                        hospital.address_name ||
                        "주소 정보 없음"
                    );

                // 전화번호를 표시합니다.
                const phone = document.createElement("p");
                phone.textContent =
                    "☎ 전화번호: " +
                    (hospital.phone || "카카오 검색 결과에 정보 없음");

                // 확인되지 않은 진료시간은 임의로 표시하지 않습니다.
                const hours = document.createElement("p");
                hours.textContent =
                    "🕒 진료시간: 별도 확인 필요";

                // 방문 전 확인할 사항을 표시합니다.
                const notice = document.createElement("p");
                notice.className = "notice";
                notice.textContent =
                    "방문 전 전화로 현재 진료 여부, 야간·휴일 운영시간, " +
                    "소아 진료 가능 여부를 확인하세요.";

                item.append(title, address, phone, hours, notice);

                // 카카오맵 상세 페이지 링크를 추가합니다.
                if (hospital.place_url) {
                    const link = document.createElement("a");

                    link.textContent = "카카오맵에서 보기";
                    link.href = hospital.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";

                    item.appendChild(link);
                }

                // 목록을 선택하면 지도 중심을 병원 위치로 옮깁니다.
                function selectHospital() {
                    map.panTo(position);
                    showHospitalInfo(hospital, marker);
                }

                item.addEventListener("click", selectHospital);

                item.addEventListener("keydown", function(event) {
                    if (
                        (event.key === "Enter" || event.key === " ") &&
                        event.target === item
                    ) {
                        event.preventDefault();
                        selectHospital();
                    }
                });

                resultList.appendChild(item);
            });

            // 검색 결과가 보이도록 지도 범위를 조정합니다.
            if (hospitals.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 선택한 병원의 이름과 주소를 지도 팝업으로 표시합니다.
        function showHospitalInfo(hospital, marker) {
            const content = document.createElement("div");

            content.style.cssText =
                "padding:10px 12px; min-width:160px; max-width:250px;" +
                "font-size:13px; line-height:1.6; overflow-wrap:anywhere;";

            const title = document.createElement("strong");
            title.textContent = hospital.place_name;

            const address = document.createElement("div");
            address.textContent =
                hospital.road_address_name ||
                hospital.address_name ||
                "주소 정보 없음";

            const phone = document.createElement("div");
            phone.textContent =
                hospital.phone || "전화번호 정보 없음";

            content.append(title, address, phone);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 카카오 지도 SDK가 준비된 뒤에만 지도를 초기화합니다.
        window.addEventListener("load", function() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus(
                    "카카오 지도 SDK 로딩 실패: JavaScript 키와 배포 도메인을 확인하세요."
                );

                console.error(
                    "카카오 SDK가 로드되지 않았습니다. " +
                    "JavaScript 키와 등록 도메인을 확인하세요."
                );

                return;
            }

            kakao.maps.load(function() {
                try {
                    initializeMap();
                    console.log("카카오 지도 초기화 성공");
                } catch (error) {
                    console.error("지도 초기화 오류:", error);

                    setStatus(
                        "지도 초기화 실패: 개발자 도구 Console을 확인하세요."
                    );
                }
            });
        });
    </script>
</body>
</html>
