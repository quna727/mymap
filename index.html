<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달빛어린이병원 지도</title>

    <style>
        /* 모든 요소의 크기 계산 방식을 통일합니다. */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 410px;
            min-width: 340px;
            display: flex;
            flex-direction: column;
            background: white;
            border-right: 1px solid #ddd;
            z-index: 1;
        }

        .header {
            padding: 22px 20px 14px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        /* 병원 종류를 선택하는 탭 */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 16px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #555;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            background: #3182f6;
            border-color: #3182f6;
            color: white;
        }

        /* 지역 선택 영역 */
        .region-box {
            display: grid;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .region-box label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }

        .region-box select,
        .region-box input {
            width: 100%;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: white;
            font-size: 13px;
        }

        /* 직접 검색하는 입력창 */
        .search-box {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .search-box input {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box button,
        .location-button {
            padding: 11px 14px;
            border: none;
            border-radius: 8px;
            background: #3182f6;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .status {
            padding: 0 18px 12px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        /* 병원 목록 */
        .result-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .place-item {
            padding: 16px 18px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover,
        .place-item:focus {
            background: #f5f8ff;
            outline-color: #3182f6;
        }

        .place-item h3 {
            margin: 0 0 9px;
            font-size: 16px;
        }

        .place-item p {
            margin: 6px 0;
            color: #555;
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .place-item .notice {
            margin-top: 10px;
            padding: 9px;
            border-radius: 6px;
            background: #fff7e6;
            color: #805b15;
        }

        .place-item a {
            display: inline-block;
            margin-top: 9px;
            color: #1765cf;
            font-size: 12px;
            text-decoration: none;
        }

        .empty-message {
            padding: 24px 18px;
            color: #777;
            font-size: 13px;
            line-height: 1.7;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            position: relative;
            flex: 1;
            min-width: 0;
            background: #f2f4f7;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .location-button {
            position: absolute;
            right: 16px;
            bottom: 28px;
            z-index: 2;
            background: white;
            border: 1px solid #ddd;
            color: #222;
            box-shadow: 0 2px 8px #00000018;
        }

        .location-button:hover {
            background: #f5f8ff;
        }

        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 55%;
                min-height: 300px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 20px;
            }

            .tabs {
                padding-bottom: 10px;
            }

            .region-box {
                grid-template-columns: 1fr 1fr;
                padding-bottom: 10px;
            }

            .region-box label {
                grid-column: 1 / -1;
            }

            .map-area {
                flex: 1;
                min-height: 0;
            }

            .location-button {
                right: 12px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 병원 검색 영역 -->
        <aside class="sidebar">
            <header class="header">
                <h1>🌙 달빛 어린이병원 지도</h1>
                <p>
                    야간·휴일에 진료 가능한 소아 진료기관을 찾아보세요.
                    방문 전 반드시 진료 여부를 확인하세요.
                </p>
            </header>

            <!-- 검색 종류를 선택하는 탭 -->
            <div class="tabs">
                <button
                    type="button"
                    class="tab-button active"
                    data-type="moonlight"
                    aria-pressed="true"
                >
                    🌙 달빛어린이병원
                </button>

                <button
                    type="button"
                    class="tab-button"
                    data-type="pediatric"
                    aria-pressed="false"
                >
                    🏥 주변 소아청소년과
                </button>
            </div>

            <!-- 지역 선택 -->
            <div class="region-box">
                <label for="provinceSelect">진료기관을 찾을 지역</label>

                <select id="provinceSelect">
                    <option value="">시·도 선택</option>
                    <option value="서울특별시" selected>서울특별시</option>
                    <option value="부산광역시">부산광역시</option>
                    <option value="대구광역시">대구광역시</option>
                    <option value="인천광역시">인천광역시</option>
                    <option value="광주광역시">광주광역시</option>
                    <option value="대전광역시">대전광역시</option>
                    <option value="울산광역시">울산광역시</option>
                    <option value="세종특별자치시">세종특별자치시</option>
                    <option value="경기도">경기도</option>
                    <option value="강원특별자치도">강원특별자치도</option>
                    <option value="충청북도">충청북도</option>
                    <option value="충청남도">충청남도</option>
                    <option value="전북특별자치도">전북특별자치도</option>
                    <option value="전라남도">전라남도</option>
                    <option value="경상북도">경상북도</option>
                    <option value="경상남도">경상남도</option>
                    <option value="제주특별자치도">제주특별자치도</option>
                </select>

                <select id="districtSelect">
                    <option value="">시·군·구 선택</option>
                    <option>강남구</option>
                    <option>강동구</option>
                    <option>강북구</option>
                    <option>강서구</option>
                    <option>관악구</option>
                    <option>광진구</option>
                    <option>구로구</option>
                    <option>금천구</option>
                    <option>노원구</option>
                    <option>도봉구</option>
                    <option>동대문구</option>
                    <option>동작구</option>
                    <option>마포구</option>
                    <option>서대문구</option>
                    <option>서초구</option>
                    <option>성동구</option>
                    <option>성북구</option>
                    <option>송파구</option>
                    <option>양천구</option>
                    <option>영등포구</option>
                    <option>용산구</option>
                    <option>은평구</option>
                    <option>종로구</option>
                    <option>중구</option>
                    <option>중랑구</option>
                </select>

                <input
                    id="dongInput"
                    type="text"
                    placeholder="읍·면·동 입력 (선택)"
                    aria-label="읍면동 입력"
                >
            </div>

            <!-- 직접 검색 -->
            <form class="search-box" id="searchForm">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="지역 또는 병원명 검색"
                    aria-label="검색어"
                >
                <button type="submit" id="searchButton">검색</button>
            </form>

            <div class="status" id="status" role="status" aria-live="polite">
                지도를 준비하고 있습니다...
            </div>

            <div class="result-list" id="resultList">
                <div class="empty-message">
                    지도를 불러온 뒤 병원 종류를 선택해 주세요.
                </div>
            </div>
        </aside>

        <!-- 오른쪽 지도 영역 -->
        <main class="map-area">
            <div id="map"></div>

            <button
                type="button"
                class="location-button"
                id="locationButton"
            >
                현재 위치로 이동
            </button>
        </main>
    </div>

    <!-- 카카오 지도 SDK: 본인의 JavaScript 키와 등록된 웹 도메인을 확인하세요. -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services&autoload=false"></script>

    <script>
        // 기본 지도 위치는 서울시청입니다.
        const defaultLatitude = 37.566826;
        const defaultLongitude = 126.9786567;
        const defaultLevel = 5;

        // 지도와 검색에 사용하는 변수입니다.
        let map = null;
        let placesService = null;
        let infoWindow = null;
        let currentMarker = null;
        let placeMarkers = [];
        let currentPosition = null;
        let isMapReady = false;
        let activeType = "moonlight";
        let searchSequence = 0;

        // HTML 요소를 변수에 저장합니다.
        const provinceSelect = document.getElementById("provinceSelect");
        const districtSelect = document.getElementById("districtSelect");
        const dongInput = document.getElementById("dongInput");
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const statusElement = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const locationButton = document.getElementById("locationButton");
        const tabButtons = document.querySelectorAll(".tab-button");

        // 상태 메시지를 표시합니다.
        function setStatus(message) {
            statusElement.textContent = message;
        }

        // 현재 선택한 지역을 문자열로 만듭니다.
        function getSelectedRegion() {
            const province = provinceSelect.value;
            const district = districtSelect.value.trim();
            const dong = dongInput.value.trim();

            return [province, district, dong]
                .filter(Boolean)
                .join(" ");
        }

        // 이전 검색의 마커와 팝업을 지웁니다.
        function clearPlaceMarkers() {
            placeMarkers.forEach(function(marker) {
                marker.setMap(null);
            });

            placeMarkers = [];

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // 검색 결과 목록을 지웁니다.
        function clearResults() {
            resultList.replaceChildren();
        }

        // 목록에 안내 메시지를 표시합니다.
        function showEmptyMessage(message) {
            const item = document.createElement("div");
            item.className = "empty-message";
            item.textContent = message;
            resultList.appendChild(item);
        }

        // 지도와 검색 서비스를 초기화합니다.
        function initializeMap() {
            const mapContainer = document.getElementById("map");

            map = new kakao.maps.Map(mapContainer, {
                center: new kakao.maps.LatLng(
                    defaultLatitude,
                    defaultLongitude
                ),
                level: defaultLevel
            });

            placesService = new kakao.maps.services.Places(map);

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            isMapReady = true;

            // 탭을 누르면 해당 종류의 병원을 검색합니다.
            tabButtons.forEach(function(button) {
                button.addEventListener("click", function() {
                    activeType = button.dataset.type;

                    tabButtons.forEach(function(tab) {
                        const isActive = tab === button;
                        tab.classList.toggle("active", isActive);
                        tab.setAttribute(
                            "aria-pressed",
                            String(isActive)
                        );
                    });

                    searchInput.value = "";
                    searchHospitals();
                });
            });

            // 검색 폼을 제출하면 병원을 검색합니다.
            searchForm.addEventListener("submit", function(event) {
                event.preventDefault();
                searchHospitals();
            });

            // 지역이 바뀌면 선택한 지역의 병원을 다시 검색합니다.
            provinceSelect.addEventListener("change", function() {
                updateDistrictOptions();
                searchHospitals();
            });

            districtSelect.addEventListener("change", searchHospitals);

            dongInput.addEventListener("change", searchHospitals);

            // 현재 위치 버튼을 연결합니다.
            locationButton.addEventListener("click", getCurrentLocation);

            setStatus("현재 위치를 확인하고 있습니다...");
            getCurrentLocation();
        }

        // 서울 이외 지역의 구 목록은 자동으로 채우지 않으므로 직접 입력할 수 있게 합니다.
        function updateDistrictOptions() {
            if (provinceSelect.value === "서울특별시") {
                districtSelect.disabled = false;
                districtSelect.innerHTML =
                    '<option value="">시·군·구 선택</option>';

                const seoulDistricts = [
                    "강남구", "강동구", "강북구", "강서구", "관악구",
                    "광진구", "구로구", "금천구", "노원구", "도봉구",
                    "동대문구", "동작구", "마포구", "서대문구", "서초구",
                    "성동구", "성북구", "송파구", "양천구", "영등포구",
                    "용산구", "은평구", "종로구", "중구", "중랑구"
                ];

                seoulDistricts.forEach(function(district) {
                    const option = document.createElement("option");
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            } else {
                // 다른 시·도의 행정구역은 검색어에 직접 입력하도록 안내합니다.
                districtSelect.disabled = true;
                districtSelect.innerHTML =
                    '<option value="">시·군·구는 검색창에 입력</option>';
            }
        }

        // 브라우저 위치 정보를 요청합니다.
        function getCurrentLocation() {
            if (!isMapReady || !map) {
                return;
            }

            if (!navigator.geolocation) {
                setStatus(
                    "위치 기능을 사용할 수 없습니다. 지역을 선택해 검색하세요."
                );
                return;
            }

            setStatus("현재 위치를 확인하고 있습니다...");

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setCenter(currentPosition);
                    map.setLevel(defaultLevel);

                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    currentMarker = new kakao.maps.Marker({
                        position: currentPosition,
                        map: map
                    });

                    setStatus(
                        "현재 위치를 확인했습니다. 병원 종류를 선택하세요."
                    );

                    // 현재 위치를 확인한 뒤 선택한 탭의 병원을 검색합니다.
                    searchHospitals();
                },
                function(error) {
                    let message =
                        "위치를 확인하지 못했습니다. 지역을 선택해 검색하세요.";

                    if (error.code === error.PERMISSION_DENIED) {
                        message =
                            "위치 권한이 거부되었습니다. 지역을 선택해 검색하세요.";
                    } else if (error.code === error.TIMEOUT) {
                        message =
                            "위치 확인 시간이 초과되었습니다. 지역을 선택해 검색하세요.";
                    }

                    setStatus(message);

                    // 위치를 허용하지 않아도 기본 지역으로 검색할 수 있습니다.
                    searchHospitals();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 선택한 탭과 지역에 따라 병원을 검색합니다.
        function searchHospitals() {
            if (!isMapReady || !placesService) {
                setStatus("지도를 준비하고 있습니다.");
                return;
            }

            const thisSearch = ++searchSequence;
            const region = getSelectedRegion();
            const typedKeyword = searchInput.value.trim();

            const hospitalKeyword = activeType === "moonlight"
                ? "달빛어린이병원"
                : "소아청소년과";

            // 검색창에 입력한 내용이 있으면 해당 검색어를 우선 사용합니다.
            const keyword = [
                region,
                typedKeyword || hospitalKeyword
            ].filter(Boolean).join(" ");

            clearPlaceMarkers();
            clearResults();

            setStatus("병원 정보를 검색하고 있습니다...");
            searchButton.disabled = true;

            // 현재 위치 또는 선택한 지역을 중심으로 검색합니다.
            const searchCenter = currentPosition ||
                new kakao.maps.LatLng(
                    defaultLatitude,
                    defaultLongitude
                );

            // 카카오 장소 검색 API를 호출합니다.
            placesService.keywordSearch(
                keyword,
                function(data, status) {
                    // 이전 검색이 늦게 도착해 현재 결과를 덮어쓰지 않게 합니다.
                    if (thisSearch !== searchSequence) {
                        return;
                    }

                    searchButton.disabled = false;

                    if (status === kakao.maps.services.Status.OK) {
                        displayHospitals(data);

                        setStatus(
                            "검색 결과 " + data.length +
                            "개입니다. 진료시간과 진료 여부는 방문 전 확인하세요."
                        );
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        showEmptyMessage(
                            "검색 결과가 없습니다. 지역이나 검색어를 바꿔 보세요."
                        );
                        setStatus("검색 결과가 없습니다.");
                    } else {
                        showEmptyMessage(
                            "검색에 실패했습니다. 잠시 후 다시 시도해 주세요."
                        );
                        setStatus(
                            "검색 중 오류가 발생했습니다. 카카오 키와 도메인 설정을 확인하세요."
                        );
                    }
                },
                {
                    location: searchCenter,
                    radius: 20000,
                    sort: kakao.maps.services.SortBy.DISTANCE,
                    size: 15
                }
            );
        }

        // 병원 검색 결과를 지도와 목록에 표시합니다.
        function displayHospitals(hospitals) {
            const bounds = new kakao.maps.LatLngBounds();

            hospitals.forEach(function(hospital) {
                const position = new kakao.maps.LatLng(
                    hospital.y,
                    hospital.x
                );

                const marker = new kakao.maps.Marker({
                    position: position,
                    map: map
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                // 마커를 누르면 병원 이름과 주소를 팝업으로 표시합니다.
                kakao.maps.event.addListener(marker, "click", function() {
                    showHospitalInfo(hospital, marker);
                });

                // 병원 목록 항목을 만듭니다.
                const item = document.createElement("article");
                item.className = "place-item";
                item.tabIndex = 0;

                const title = document.createElement("h3");
                title.textContent = hospital.place_name;

                const address = document.createElement("p");
                address.textContent =
                    "📍 주소: " +
                    (
                        hospital.road_address_name ||
                        hospital.address_name ||
                        "주소 정보 없음"
                    );

                const phone = document.createElement("p");
                phone.textContent =
                    "☎ 전화번호: " +
                    (hospital.phone || "검색 결과에 정보 없음");

                const hours = document.createElement("p");
                hours.textContent =
                    "🕒 진료시간: 별도 확인 필요 (검색 결과에 진료시간 없음)";

                const notice = document.createElement("p");
                notice.className = "notice";
                notice.textContent =
                    "방문 전 주의사항: 전화로 현재 진료 여부, 야간·휴일 진료시간, " +
                    "소아 진료 가능 여부를 확인하세요. 응급 증상이 있으면 119에 문의하세요.";

                item.append(title, address, phone, hours, notice);

                // 카카오맵 상세 페이지 링크를 추가합니다.
                if (hospital.place_url) {
                    const link = document.createElement("a");
                    link.textContent = "카카오맵에서 상세 정보 보기";
                    link.href = hospital.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";

                    item.appendChild(link);
                }

                // 목록을 누르면 지도 중심을 해당 병원으로 이동합니다.
                function selectHospital() {
                    map.panTo(position);
                    showHospitalInfo(hospital, marker);
                }

                item.addEventListener("click", selectHospital);

                item.addEventListener("keydown", function(event) {
                    if (
                        (event.key === "Enter" || event.key === " ") &&
                        event.target === item
                    ) {
                        event.preventDefault();
                        selectHospital();
                    }
                });

                resultList.appendChild(item);
            });

            // 검색 결과가 모두 보이도록 지도 범위를 조정합니다.
            if (hospitals.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 선택한 병원의 이름과 주소를 지도 팝업에 표시합니다.
        function showHospitalInfo(hospital, marker) {
            const content = document.createElement("div");
            content.style.cssText =
                "padding:10px 12px; min-width:160px; max-width:250px;" +
                "font-size:13px; line-height:1.6; overflow-wrap:anywhere;";

            const title = document.createElement("strong");
            title.textContent = hospital.place_name;

            const address = document.createElement("div");
            address.textContent =
                hospital.road_address_name ||
                hospital.address_name ||
                "주소 정보 없음";

            const phone = document.createElement("div");
            phone.textContent =
                hospital.phone || "전화번호 정보 없음";

            content.append(title, address, phone);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 카카오 SDK 로딩이 완료된 후 지도를 초기화합니다.
        window.addEventListener("load", function() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus(
                    "카카오 지도 SDK를 불러오지 못했습니다. JavaScript 키와 웹 도메인을 확인하세요."
                );
                return;
            }

            kakao.maps.load(function() {
                try {
                    initializeMap();
                } catch (error) {
                    console.error("지도 초기화 오류:", error);
                    setStatus(
                        "지도 초기화에 실패했습니다. 개발자 도구 콘솔을 확인하세요."
                    );
                }
            });
        });
    </script>
</body>
</html>
