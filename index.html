<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 달빛어린이병원 지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            color: #222;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 380px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background: white;
            z-index: 1;
        }

        .header {
            padding: 22px 20px 16px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        .filter-area {
            padding: 0 16px 12px;
        }

        .filter-area label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .filter-area select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box button {
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            background: #3182f6;
            color: white;
            cursor: pointer;
        }

        .search-box button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .status {
            padding: 0 18px 12px;
            color: #666;
            font-size: 12px;
            line-height: 1.6;
        }

        .result-list {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .place-item {
            padding: 15px 18px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f5f8ff;
        }

        .place-item h3 {
            margin: 0 0 7px;
            font-size: 15px;
        }

        .place-item p {
            margin: 4px 0;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }

        .place-item a {
            display: inline-block;
            margin-top: 7px;
            color: #3182f6;
            font-size: 12px;
            text-decoration: none;
        }

        .map-area {
            flex: 1;
            min-width: 0;
            position: relative;
            background: #f2f4f7;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .location-button {
            position: absolute;
            right: 16px;
            bottom: 24px;
            z-index: 2;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px #00000018;
            cursor: pointer;
        }

        .location-button:hover {
            background: #f5f8ff;
        }

        @media (max-width: 650px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 52%;
                min-height: 260px;
            }

            .header {
                padding: 12px 16px;
            }

            .header h1 {
                font-size: 19px;
            }

            .map-area {
                flex: 1;
                min-height: 0;
            }

            .location-button {
                right: 12px;
                bottom: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색 영역 -->
        <aside class="sidebar">
            <div class="header">
                <h1>🌙 달빛어린이병원 지도</h1>
                <p>전국의 소아 진료 장소를 검색해 보세요.</p>
            </div>

            <div class="filter-area">
                <label for="regionSelect">검색 지역</label>
                <select id="regionSelect">
                    <option value="">전국 검색</option>
                    <option value="서울">서울</option>
                    <option value="경기">경기</option>
                    <option value="인천">인천</option>
                    <option value="강원">강원</option>
                    <option value="충북">충북</option>
                    <option value="충남">충남</option>
                    <option value="세종">세종</option>
                    <option value="대전">대전</option>
                    <option value="전북">전북</option>
                    <option value="전남">전남</option>
                    <option value="광주">광주</option>
                    <option value="경북">경북</option>
                    <option value="경남">경남</option>
                    <option value="대구">대구</option>
                    <option value="울산">울산</option>
                    <option value="부산">부산</option>
                    <option value="제주">제주</option>
                </select>
            </div>

            <form class="search-box" id="searchForm">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="달빛어린이병원, 소아과 등"
                    aria-label="병원 검색어"
                    required
                >
                <button type="submit" id="searchButton">검색</button>
            </form>

            <div class="status" id="status" role="status" aria-live="polite">
                지도를 불러오고 있습니다.
            </div>

            <div class="result-list" id="resultList"></div>
        </aside>

        <!-- 오른쪽 지도 영역 -->
        <main class="map-area">
            <div id="map"></div>

            <button
                class="location-button"
                id="locationButton"
                type="button"
            >
                📍 내 위치 찾기
            </button>
        </main>
    </div>

    <!-- 카카오 지도 SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services&autoload=false"></script>

    <script>
        // 전국을 처음에 넓게 볼 수 있도록 지도의 중심을 설정합니다.
        const defaultLatitude = 36.3;
        const defaultLongitude = 127.8;
        const defaultLevel = 13;

        // 지도와 검색에 사용할 변수입니다.
        let map = null;
        let placesService = null;
        let currentMarker = null;
        let placeMarkers = [];
        let infoWindow = null;
        let isMapReady = false;

        // HTML 요소를 가져옵니다.
        const searchForm = document.getElementById("searchForm");
        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const regionSelect = document.getElementById("regionSelect");
        const statusElement = document.getElementById("status");
        const resultList = document.getElementById("resultList");
        const locationButton = document.getElementById("locationButton");

        // 검색 상태를 화면에 표시합니다.
        function setStatus(message) {
            statusElement.textContent = message;
        }

        // 카카오 지도 SDK가 준비되면 지도를 만듭니다.
        function initializeMap() {
            const mapContainer = document.getElementById("map");

            map = new kakao.maps.Map(mapContainer, {
                center: new kakao.maps.LatLng(
                    defaultLatitude,
                    defaultLongitude
                ),
                level: defaultLevel
            });

            placesService = new kakao.maps.services.Places(map);

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 3
            });

            isMapReady = true;

            setStatus(
                "전국 지도가 준비되었습니다. 위치 권한을 허용하면 내 위치로 이동합니다."
            );

            // 처음 사이트에 들어오면 현재 위치를 요청합니다.
            getCurrentLocation();

            // 검색 버튼을 눌렀을 때 검색합니다.
            searchForm.addEventListener("submit", function(event) {
                event.preventDefault();
                searchPlaces();
            });

            // 내 위치 버튼을 누르면 현재 위치를 다시 확인합니다.
            locationButton.addEventListener("click", function() {
                getCurrentLocation();
            });
        }

        // 현재 위치를 확인하고 지도에 표시합니다.
        function getCurrentLocation() {
            if (!isMapReady || !map) {
                return;
            }

            if (!navigator.geolocation) {
                setStatus(
                    "이 브라우저에서는 위치 기능을 사용할 수 없습니다. 전국 검색은 가능합니다."
                );
                return;
            }

            setStatus("현재 위치를 확인하고 있습니다...");

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    const currentPosition = new kakao.maps.LatLng(
                        latitude,
                        longitude
                    );

                    // 현재 위치로 지도를 이동합니다.
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 이전 현재 위치 마커를 제거합니다.
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    // 현재 위치에 마커를 표시합니다.
                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition
                    });

                    setStatus(
                        "현재 위치를 표시했습니다. 지역을 선택하고 병원을 검색해 보세요."
                    );
                },
                function(error) {
                    let message = "현재 위치를 확인하지 못했습니다.";

                    if (error.code === error.PERMISSION_DENIED) {
                        message = "위치 권한이 거부되었습니다. 브라우저 주소창의 사이트 설정에서 위치 권한을 허용할 수 있습니다.";
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        message = "현재 위치 정보를 확인할 수 없습니다.";
                    } else if (error.code === error.TIMEOUT) {
                        message = "위치 확인 시간이 초과되었습니다.";
                    }

                    setStatus(message + " 전국 지도와 검색 기능은 계속 사용할 수 있습니다.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 이전 검색의 마커와 정보창을 지웁니다.
        function clearPlaceMarkers() {
            placeMarkers.forEach(function(marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
            infoWindow.close();
        }

        // 검색 결과 목록을 비웁니다.
        function clearResults() {
            resultList.replaceChildren();
        }

        // 입력한 검색어로 장소를 검색합니다.
        function searchPlaces() {
            if (!isMapReady || !placesService) {
                setStatus("지도를 준비하고 있습니다.");
                return;
            }

            const enteredKeyword = searchInput.value.trim();
            const selectedRegion = regionSelect.value;

            if (!enteredKeyword) {
                setStatus("검색어를 입력해 주세요.");
                return;
            }

            // 지역을 선택하면 검색어 앞에 지역명을 붙입니다.
            const keyword = selectedRegion
                ? selectedRegion + " " + enteredKeyword
                : enteredKeyword;

            clearResults();
            clearPlaceMarkers();

            setStatus("장소를 검색하고 있습니다...");
            searchButton.disabled = true;

            placesService.keywordSearch(
                keyword,
                function(data, status, pagination) {
                    searchButton.disabled = false;

                    if (status === kakao.maps.services.Status.OK) {
                        displayPlaces(data);

                        setStatus(
                            "검색 결과 " + data.length +
                            "개입니다. 카카오 검색 결과는 공식 지정 병원 목록과 다를 수 있습니다."
                        );
                    } else if (
                        status === kakao.maps.services.Status.ZERO_RESULT
                    ) {
                        setStatus(
                            "검색 결과가 없습니다. 다른 검색어나 지역을 선택해 보세요."
                        );
                    } else {
                        setStatus(
                            "검색 중 오류가 발생했습니다. 카카오 개발자 설정과 검색어를 확인해 주세요."
                        );
                    }
                },
                {
                    size: 15
                }
            );
        }

        // 검색 결과를 목록과 지도 마커로 표시합니다.
        function displayPlaces(places) {
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(function(place) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position
                });

                placeMarkers.push(marker);
                bounds.extend(position);

                // 마커를 누르면 병원 정보를 표시합니다.
                kakao.maps.event.addListener(marker, "click", function() {
                    showPlaceInfo(place, marker);
                });

                // 검색 결과 항목을 만듭니다.
                const item = document.createElement("article");
                item.className = "place-item";
                item.tabIndex = 0;

                const title = document.createElement("h3");
                title.textContent = place.place_name;

                const category = document.createElement("p");
                category.textContent =
                    place.category_name || "분류 정보 없음";

                const address = document.createElement("p");
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                item.append(title, category, address);

                // 카카오맵 상세 페이지 링크를 추가합니다.
                if (place.place_url) {
                    const link = document.createElement("a");
                    link.textContent = "카카오맵에서 보기";
                    link.href = place.place_url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";

                    // 링크를 누를 때 목록 선택 이벤트가 실행되지 않게 합니다.
                    link.addEventListener("click", function(event) {
                        event.stopPropagation();
                    });

                    item.appendChild(link);
                }

                // 목록을 누르면 지도에서 해당 장소를 보여줍니다.
                function selectPlace() {
                    map.panTo(position);
                    showPlaceInfo(place, marker);
                }

                item.addEventListener("click", selectPlace);

                item.addEventListener("keydown", function(event) {
                    if (
                        event.target === item &&
                        (event.key === "Enter" || event.key === " ")
                    ) {
                        event.preventDefault();
                        selectPlace();
                    }
                });

                resultList.appendChild(item);
            });

            // 검색 결과가 모두 보이도록 지도 범위를 조절합니다.
            if (places.length > 0) {
                map.setBounds(bounds);
            }
        }

        // 지도 위에 선택한 장소의 이름과 주소를 표시합니다.
        function showPlaceInfo(place, marker) {
            const content = document.createElement("div");
            content.style.cssText =
                "padding:10px 12px; min-width:150px; max-width:240px; " +
                "font-size:13px; line-height:1.6; overflow-wrap:anywhere;";

            const title = document.createElement("strong");
            title.textContent = place.place_name;

            const address = document.createElement("div");
            address.textContent =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            content.append(title, address);

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        // 카카오 SDK를 불러온 뒤 지도를 초기화합니다.
        window.addEventListener("load", function() {
            if (!window.kakao || !kakao.maps) {
                setStatus(
                    "카카오 지도 SDK를 불러오지 못했습니다. 앱 키와 사이트 도메인 설정을 확인해 주세요."
                );
                return;
            }

            kakao.maps.load(function() {
                try {
                    initializeMap();
                } catch (error) {
                    console.error("지도 초기화 오류:", error);

                    setStatus(
                        "지도 초기화에 실패했습니다. 개발자 도구 Console을 확인해 주세요."
                    );
                }
            });
        });
    </script>
</body>
</html>
