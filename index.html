<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전국 달빛어린이병원 지도</title>

  <!-- 카카오맵 SDK -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cc56435398f9d272918b6e8f89c3a42a&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    header {
      padding: 16px 20px;
      background: #2878e8;
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .container {
      display: flex;
      height: calc(100vh - 94px);
      min-height: 500px;
    }

    .sidebar {
      width: 390px;
      min-width: 320px;
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
      background: #fff;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: #2878e8;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button.secondary {
      background: #edf3fc;
      color: #205ca8;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .full-button {
      width: 100%;
      margin-bottom: 10px;
    }

    .notice {
      padding: 11px;
      margin: 12px 0;
      border-radius: 8px;
      background: #f4f7fb;
      font-size: 13px;
      line-height: 1.6;
    }

    #status {
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hospital {
      padding: 13px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
    }

    .hospital:hover {
      background: #f6f9ff;
    }

    .hospital h3 {
      margin: 0 0 7px;
      font-size: 15px;
      line-height: 1.4;
    }

    .hospital p {
      margin: 4px 0;
      color: #555;
      font-size: 12px;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      margin-bottom: 7px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #e8f2ff;
      color: #205ca8;
      font-size: 11px;
    }

    .tag.unknown {
      background: #fff1d8;
      color: #8a5700;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    @media (max-width: 700px) {
      .container {
        height: auto;
        min-height: 0;
        flex-direction: column-reverse;
      }

      #map {
        height: 48vh;
        min-height: 300px;
        flex: none;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        border-right: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🌙 전국 달빛어린이병원 지도</h1>
    <p>공식 달빛어린이병원 우선 · 주변 소아과 검색 · 거리순 확인</p>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="search-row">
        <input
          id="searchInput"
          type="text"
          placeholder="지역 또는 병원명 검색"
          aria-label="지역 또는 병원명 검색"
        >
        <button id="searchButton">검색</button>
      </div>

      <button id="locationButton" class="secondary full-button">
        📍 현재 위치로 이동
      </button>

      <button id="nearbyButton" class="full-button">
        주변 병원 다시 검색
      </button>

      <div class="notice">
        <strong>진료 상태 안내</strong><br>
        카카오맵 검색 결과만으로는 현재 진료 중인지 확인할 수 없습니다.
        진료시간 데이터가 연결되지 않은 병원은 영업 중 목록에 포함하지 않습니다.
      </div>

      <div id="status" role="status" aria-live="polite">
        지도를 준비하고 있습니다.
      </div>

      <div id="results"></div>
    </aside>

    <div id="map" aria-label="병원 위치 지도"></div>
  </div>

  <script>
    // 지도와 장소 검색 객체
    let map;
    let places;
    let userPosition = null;
    let markers = [];
    let currentResults = [];
    let isSearching = false;

    const statusElement = document.getElementById("status");
    const resultsElement = document.getElementById("results");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const nearbyButton = document.getElementById("nearbyButton");
    const locationButton = document.getElementById("locationButton");

    // 공식 병원 및 주변 소아과의 영업 상태 데이터 연결 지점
    // 실제로 확인된 진료 상태 API가 연결되기 전까지 비워 둡니다.
    //
    // 나중에 검증된 API를 연결하면 장소 ID별로 현재 상태를 저장할 수 있습니다.
    // 예시 구조:
    // const verifiedStatusByPlaceId = {
    //   "카카오장소ID": {
    //     isOpenNow: true,
    //     checkedAt: "2026-10-15T14:00:00+09:00",
    //     source: "검증된 진료정보 API"
    //   }
    // };
    //
    // 아래 빈 객체는 실제 진료 상태 데이터가 아닙니다.
    const verifiedStatusByPlaceId = {};

    // 서울을 기본 시작 위치로 사용합니다.
    // 위치 권한을 허용하면 사용자 위치로 바뀝니다.
    const defaultPosition = new kakao.maps.LatLng(37.5665, 126.9780);

    // 지도 초기화
    function initializeMap() {
      map = new kakao.maps.Map(document.getElementById("map"), {
        center: defaultPosition,
        level: 5
      });

      places = new kakao.maps.services.Places();

      statusElement.textContent =
        "현재 위치를 확인하고 있습니다. 위치 권한을 허용하면 주변 병원을 검색합니다.";

      requestCurrentLocation();
    }

    // 현재 위치 요청
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "이 브라우저는 위치 기능을 지원하지 않습니다. 지도에서 지역을 검색해 주세요.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          userPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(userPosition);

          new kakao.maps.Marker({
            map: map,
            position: userPosition,
            title: "현재 위치"
          });

          searchNearbyHospitals();
        },
        function() {
          statusElement.textContent =
            "현재 위치를 가져오지 못했습니다. 서울을 기준으로 시작합니다. 지역을 검색해 주세요.";

          userPosition = map.getCenter();
          searchNearbyHospitals();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 두 장소 사이의 직선거리(미터)를 계산합니다.
    function calculateDistance(positionA, positionB) {
      const earthRadius = 6371000;
      const toRadians = function(degrees) {
        return degrees * Math.PI / 180;
      };

      const lat1 = toRadians(positionA.getLat());
      const lat2 = toRadians(positionB.getLat());
      const deltaLat = toRadians(positionB.getLat() - positionA.getLat());
      const deltaLng = toRadians(positionB.getLng() - positionA.getLng());

      const a =
        Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(lat1) * Math.cos(lat2) *
        Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);

      return earthRadius * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );
    }

    // 거리를 보기 쉬운 단위로 바꿉니다.
    function formatDistance(distance) {
      if (distance < 1000) {
        return Math.round(distance) + "m";
      }

      return (distance / 1000).toFixed(1) + "km";
    }

    // 현재 영업 상태를 확인합니다.
    // 검증된 상태 데이터가 없으면 반드시 확인 불가로 처리합니다.
    function getVerifiedOpenStatus(place) {
      const verifiedData = verifiedStatusByPlaceId[place.id];

      if (!verifiedData || typeof verifiedData.isOpenNow !== "boolean") {
        return "unknown";
      }

      // 오래된 상태 정보는 현재 상태를 증명하지 못합니다.
      if (!verifiedData.checkedAt) {
        return "unknown";
      }

      const checkedTime = new Date(verifiedData.checkedAt).getTime();
      const now = Date.now();
      const fiveMinutes = 5 * 60 * 1000;

      if (
        Number.isNaN(checkedTime) ||
        checkedTime > now ||
        now - checkedTime > fiveMinutes
      ) {
        return "unknown";
      }

      return verifiedData.isOpenNow ? "open" : "closed";
    }

    // 병원 이름과 장소 정보를 하나로 합칩니다.
    function mergePlaces(existingPlaces, newPlaces, isOfficial) {
      newPlaces.forEach(function(place) {
        const existing = existingPlaces.find(function(item) {
          return item.id === place.id;
        });

        if (existing) {
          if (isOfficial) {
            existing.isOfficial = true;
          }
          return;
        }

        existingPlaces.push({
          id: place.id,
          name: place.place_name,
          address: place.road_address_name || place.address_name || "주소 정보 없음",
          phone: place.phone || "전화번호 정보 없음",
          url: place.place_url || "",
          lat: Number(place.y),
          lng: Number(place.x),
          isOfficial: isOfficial
        });
      });
    }

    // 검색 결과를 받아옵니다.
    function searchKeyword(keyword, isOfficial, callback) {
      const center = userPosition || map.getCenter();

      places.keywordSearch(
        keyword,
        function(data, result) {
          if (result === kakao.maps.services.Status.OK) {
            callback(data, isOfficial);
          } else {
            callback([], isOfficial);
          }
        },
        {
          location: center,
          radius: 20000,
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    }

    // 주변 공식 달빛어린이병원과 소아과를 검색합니다.
    function searchNearbyHospitals() {
      if (!map || isSearching) {
        return;
      }

      isSearching = true;
      nearbyButton.disabled = true;
      searchButton.disabled = true;

      statusElement.textContent = "주변 병원을 검색하고 있습니다.";
      resultsElement.innerHTML = "";

      clearMarkers();

      const foundPlaces = [];
      let completedSearches = 0;

      function finishOneSearch(data, isOfficial) {
        mergePlaces(foundPlaces, data, isOfficial);
        completedSearches++;

        if (completedSearches < 2) {
          return;
        }

        isSearching = false;
        nearbyButton.disabled = false;
        searchButton.disabled = false;

        displayHospitals(foundPlaces);
      }

      // 공식 달빛어린이병원 이름으로 우선 검색합니다.
      searchKeyword("달빛어린이병원", true, finishOneSearch);

      // 주변 소아청소년과도 함께 검색합니다.
      searchKeyword("소아청소년과", false, finishOneSearch);
    }

    // 검색 결과를 거리순으로 정리한 뒤 영업 중인 곳만 표시합니다.
    function displayHospitals(placesList) {
      const center = userPosition || map.getCenter();

      currentResults = placesList
        .filter(function(place) {
          return Number.isFinite(place.lat) && Number.isFinite(place.lng);
        })
        .map(function(place) {
          const position = new kakao.maps.LatLng(place.lat, place.lng);

          return {
            ...place,
            position: position,
            distance: calculateDistance(center, position),
            openStatus: getVerifiedOpenStatus(place)
          };
        })
        .sort(function(a, b) {
          // 공식 달빛어린이병원 우선, 같은 분류 안에서는 거리순
          if (a.isOfficial !== b.isOfficial) {
            return a.isOfficial ? -1 : 1;
          }

          return a.distance - b.distance;
        });

      // 요청사항: 영업 중임이 확인된 병원만 결과 목록에 표시합니다.
      const openHospitals = currentResults
        .filter(function(place) {
          return place.openStatus === "open";
        })
        .sort(function(a, b) {
          // 공식 병원 우선 원칙을 유지하면서 거리순 정렬
          if (a.isOfficial !== b.isOfficial) {
            return a.isOfficial ? -1 : 1;
          }

          return a.distance - b.distance;
        });

      if (openHospitals.length === 0) {
        statusElement.textContent =
          "현재 영업 중임이 확인된 병원이 없습니다. " +
          "주변 검색 결과 " + currentResults.length +
          "곳을 찾았지만, 연결된 진료 상태 데이터가 없어 영업 중 목록에는 표시하지 않았습니다.";

        const info = document.createElement("div");
        info.className = "notice";
        info.textContent =
          "주변 병원 검색은 완료했습니다. 진료 상태를 확인할 수 있는 공식 데이터가 연결되면 영업 중인 병원을 거리순으로 표시할 수 있습니다. 병원에 전화해 실제 진료 여부를 확인해 주세요.";

        resultsElement.appendChild(info);

        // 확인 불가 병원도 지도에서 위치를 볼 수 있도록 회색 마커로 표시합니다.
        // 지도 마커는 영업 중이라는 의미가 아닙니다.
        currentResults.forEach(function(place) {
          addMarker(place, false);
        });

        return;
      }

      statusElement.textContent =
        "현재 영업 중으로 확인된 병원 " + openHospitals.length + "곳";

      openHospitals.forEach(function(place) {
        addMarker(place, true);
        addHospitalCard(place);
      });
    }

    // 지도에 병원 마커를 추가합니다.
    function addMarker(place, isOpen) {
      const marker = new kakao.maps.Marker({
        map: map,
        position: place.position,
        title: place.name
      });

      markers.push(marker);

      const infoWindow = new kakao.maps.InfoWindow({
        content:
          '<div style="padding:8px;font-size:12px;">' +
          escapeHtml(place.name) + '<br>' +
          (isOpen ? "현재 영업 중 확인" : "진료 상태 확인 불가") +
          "</div>"
      });

      kakao.maps.event.addListener(marker, "click", function() {
        infoWindow.open(map, marker);
      });
    }

    // 병원 카드 표시
    function addHospitalCard(place) {
      const card = document.createElement("div");
      card.className = "hospital";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = place.isOfficial
        ? "공식 달빛어린이병원"
        : "주변 소아과";

      const title = document.createElement("h3");
      title.textContent = place.name;

      const address = document.createElement("p");
      address.textContent = "주소: " + place.address;

      const distance = document.createElement("p");
      distance.textContent = "현재 위치에서 약 " + formatDistance(place.distance);

      const phone = document.createElement("p");
      phone.textContent = "전화: " + place.phone;

      const status = document.createElement("p");
      status.textContent = "진료 상태: 영업 중 확인";

      card.appendChild(tag);
      card.appendChild(title);
      card.appendChild(address);
      card.appendChild(distance);
      card.appendChild(phone);
      card.appendChild(status);

      if (place.url) {
        const link = document.createElement("a");
        link.href = place.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "카카오맵에서 보기";
        link.style.fontSize = "13px";
        card.appendChild(link);
      }

      card.addEventListener("click", function(event) {
        if (event.target.tagName === "A") {
          return;
        }

        map.setCenter(place.position);
        map.setLevel(3);
      });

      resultsElement.appendChild(card);
    }

    // 검색어로 지도 위치를 이동합니다.
    function searchRegion() {
      const keyword = searchInput.value.trim();

      if (!keyword) {
        statusElement.textContent = "검색할 지역이나 병원명을 입력해 주세요.";
        return;
      }

      places.keywordSearch(keyword, function(data, result) {
        if (result !== kakao.maps.services.Status.OK || !data.length) {
          statusElement.textContent =
            "검색 결과가 없습니다. 다른 지역명이나 병원명을 입력해 주세요.";
          return;
        }

        const firstResult = data[0];
        const position = new kakao.maps.LatLng(
          Number(firstResult.y),
          Number(firstResult.x)
        );

        userPosition = position;
        map.setCenter(position);
        searchNearbyHospitals();
      });
    }

    // 기존 마커 제거
    function clearMarkers() {
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];
    }

    // 검색 결과를 HTML에 안전하게 표시하기 위한 처리
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    searchButton.addEventListener("click", searchRegion);

    searchInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchRegion();
      }
    });

    nearbyButton.addEventListener("click", function() {
      userPosition = map.getCenter();
      searchNearbyHospitals();
    });

    locationButton.addEventListener("click", requestCurrentLocation);

    // 카카오맵 SDK가 준비된 다음에 지도를 초기화합니다.
    window.addEventListener("load", initializeMap);
  </script>
</body>
</html>
